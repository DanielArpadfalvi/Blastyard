name: Android

on:
  # Every push (any branch) builds; the newest debug APK also replaces the one in the owner's
  # Google Drive folder. Docs-only pushes change nothing in the app.
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      # RevenueCat public SDK key (owner secret). Without it the app says "store unavailable"
      # and never unlocks anything (T8.1).
      - run: npx vite build
        env:
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
      - run: npx cap sync android
      - name: Build debug APK and release bundle (unsigned AAB)
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Rename APK / AAB
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk blastyard-debug-${{ env.VERSION_NAME }}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab blastyard-unsigned-${{ env.VERSION_NAME }}.aab
      - uses: actions/upload-artifact@v5
        with:
          name: blastyard-debug-apk
          path: blastyard-debug-*.apk
      # Unsigned: signing for the store comes with the release workflow (T9.5).
      - uses: actions/upload-artifact@v5
        with:
          name: blastyard-release-aab-unsigned
          path: blastyard-unsigned-*.aab
      - name: Publish to "android-debug-latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-debug-latest --yes --cleanup-tag || true
          gh release create android-debug-latest blastyard-debug-*.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Blastyard debug APK (${{ env.VERSION_NAME }})" \
            --notes "Automatic test build from ${{ github.ref_name }} @ ${{ github.sha }}. Not for store upload."
      # Owner's Drive folder "Mobile games": always one file, overwritten by the newest build.
      # Needs the secret GDRIVE_SERVICE_ACCOUNT_JSON (or GDRIVE_CLIENT_ID / GDRIVE_CLIENT_SECRET /
      # GDRIVE_REFRESH_TOKEN); skipped with a warning until it is set. See docs/RELEASE-drive.md.
      - name: Upload the debug APK to Google Drive (replaces the previous one)
        env:
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || '1zTqiGB7KHX0puHztEt7Ol2hCYDxPv1uk' }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ] && [ -z "$GDRIVE_REFRESH_TOKEN" ]; then
            echo "::warning::Google Drive upload skipped: no GDRIVE_* secret (docs/RELEASE-drive.md)"
            exit 0
          fi
          node scripts/drive-upload.mjs blastyard-debug-*.apk Blastyard-debug.apk
