name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk blastyard-debug-${{ env.VERSION_NAME }}.apk
      - uses: actions/upload-artifact@v5
        with:
          name: blastyard-debug-apk
          path: blastyard-debug-*.apk
      - name: Publish to "android-debug-latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-debug-latest --yes --cleanup-tag || true
          gh release create android-debug-latest blastyard-debug-*.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Blastyard debug APK (${{ env.VERSION_NAME }})" \
            --notes "Automatic test build from ${{ github.ref_name }} @ ${{ github.sha }}. Not for store upload."
