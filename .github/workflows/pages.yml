# Web preview for device tests (T2.4 touch spike): https://danielarpadfalvi.github.io/Blastyard/
# The preview build shows the device-test tools (touch tester, 4-corner prototype) on the start
# screen (VITE_SPIKE=1). One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      # Until Pages is switched on (one-time setup above) there is nothing to deploy to:
      # skip with a warning instead of failing every push to main.
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled (Settings → Pages → Source: GitHub Actions); skipping deploy."
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /Blastyard/
          VITE_SPIKE: '1'
      # Privacy / terms / support pages (T9.3) under /Blastyard/site/ – the app links there.
      - run: npm run site
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
